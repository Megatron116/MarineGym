name: Spheroid
# Generated. Prolate spheroid AUV, 1.0 m x 0.5 m, 4 vertical + 4 vectored-horizontal T200 thrusters, no fins.
#
# Mass matrix (analytic, body frame about the hull center):
#   rigid body: m = 130.374 kg (base_link 130.294 kg + rotors), uniform solid spheroid,
#     Ixx = 2/5 m b^2 = 3.2573, Iyy = Izz = m (a^2 + b^2)/5 = 8.1434 kg m^2 (about the CG),
#     CG 0.02 m below the center of buoyancy.
#   added mass: Lamb's coefficients for a/b = 2 (e = 0.8660):
#     k1 = 0.2100, k2 = 0.7042, k' = 0.2394, rho*V = 130.507 kg
#     m11 = k1 rho V, m22 = m33 = k2 rho V, m44 = 0, m55 = m66 = k' rho V (a^2 + b^2)/5
#
# Damping is NOT analytic: quadratic terms are drag estimates (Cd axial 0.2, crossflow 0.6,
# strip theory for pitch/yaw, roll is a guess); linear terms are placeholders. Tune or replace with data.

